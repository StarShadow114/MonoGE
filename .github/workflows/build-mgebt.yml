name: Build mgebt

on:
  push:
    branches: [dev, main]
    paths:
      - 'mgebt/**'
  pull_request:
    branches: [dev, main]
    paths:
      - 'mgebt/**'

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mgebt

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Fix permissions
        run: chmod +x gradlew

      - name: Fix gradle wrapper URL
        run: |
          sed -i 's|distributionUrl=.*|distributionUrl=https://mirrors.cloud.tencent.com/gradle/gradle-8.5-bin.zip|' \
            gradle/wrapper/gradle-wrapper.properties

      - name: Fix maven mirror
        run: |
          mkdir -p ~/.gradle
          cat > ~/.gradle/init.gradle << 'INITEOF'
          allprojects {
              repositories {
                  maven { url 'https://mirrors.cloud.tencent.com/nexus/repository/maven-public/' }
                  maven { url 'https://mirrors.cloud.tencent.com/maven-central/' }
                  mavenCentral()
              }
          }
          INITEOF

      - run: ./gradlew --stop || true

      - run: ./gradlew clean jar

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mgebt-jar
          path: mgebt/build/libs/mgebt-*.jar
          retention-days: 7
