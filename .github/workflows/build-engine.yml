name: Build Monolith Engine

on:
  push:
    paths:
      - 'engine/**'
      - 'CMakeLists.txt'
  pull_request:
    paths:
      - 'engine/**'
      - 'CMakeLists.txt'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build-arm64:
    name: Build arm64-v8a
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27

      - name: Configure CMake
        run: |
          cmake -B build-arm64 \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DANDROID_STL=c++_shared \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build-arm64 --config Release -j$(nproc)

      - name: Verify JNI symbols
        run: |
          echo "=== JNI Symbols ==="
          nm -D build-arm64/libmonolith.so | grep Java
          echo "=== File info ==="
          ls -lh build-arm64/libmonolith.so
          file build-arm64/libmonolith.so

      - name: Upload arm64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: libmonolith-arm64-v8a
          path: build-arm64/libmonolith.so

  build-armv7:
    name: Build armeabi-v7a
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27

      - name: Configure CMake
        run: |
          cmake -B build-armv7 \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=armeabi-v7a \
            -DANDROID_PLATFORM=android-24 \
            -DANDROID_STL=c++_shared \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS="-march=armv7-a -mfloat-abi=softfp -mfpu=neon"

      - name: Build
        run: cmake --build build-armv7 --config Release -j$(nproc)

      - name: Verify JNI symbols
        run: |
          echo "=== JNI Symbols ==="
          nm -D build-armv7/libmonolith.so | grep Java
          ls -lh build-armv7/libmonolith.so

      - name: Upload armv7 artifact
        uses: actions/upload-artifact@v4
        with:
          name: libmonolith-armeabi-v7a
          path: build-armv7/libmonolith.so
